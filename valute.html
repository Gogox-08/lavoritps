
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Convertitore di valute</title>

    <style>
        body {
            font-family: Georgia, sans-serif;
            background-color: #4d0da1;
            text-align: center;
        }

        h1 {
            color: white;
        }

        .box {
            background-color: #bb8df7;
            padding: 29px;
            border-radius: 29px;
            width: 500px;
            max-width: 85%;
            margin: 70px auto;
            box-shadow: 0 0 30px rgba(0,0,0,0.4);
        }
    </style>
</head>

<body>

    <h1>Convertitore di valute in Euro</h1>

    <div class="box">

        <p>Seleziona la valuta:</p>
        <select id="valuta">
            <option value="">Caricamento...</option>
        </select>

        <p>Quantità da convertire:</p>
        <input type="text" id="quantita">

        <br><br>

        <button onclick="converti()">Converti in Euro</button>

        <p id="risultato"></p>
        <p id="messaggio"></p>

    </div>

    <script>

        let richiesta = new XMLHttpRequest();

        richiesta.open("GET", "eurofxref-daily.xml", true);

        richiesta.onreadystatechange = function() {

            if (richiesta.readyState == 4) {

                if (richiesta.status == 200) {

                    let dati = richiesta.responseXML;
                    let valute = dati.getElementsByTagName("Cube");

                    let lista = document.getElementById("valuta");

                    lista.innerHTML = '<option value="">Seleziona...</option>';

                    let opzione = document.createElement("option");
                    opzione.value = 1;
                    opzione.text = "EUR";
                    lista.appendChild(opzione);

                    for (let i = 0; i < valute.length; i++) {

                        let codice = valute[i].getAttribute("currency");
                        let cambio = valute[i].getAttribute("rate");

                        if (codice != "") {

                            let opzione = document.createElement("option");
                            opzione.value = cambio;
                            opzione.text = codice;

                            lista.appendChild(opzione);
                        }

                        let data = valute[i].getAttribute("time");

                        if (data != "") {
                            document.getElementById("messaggio").innerHTML =
                                "Data dei tassi: " + data;
                        }
                    }

                } else {

                    document.getElementById("messaggio").innerHTML =
                        "Errore nel caricamento dei dati.";

                }
            }
        };

        richiesta.send();


        function converti() {

            let valuta = document.getElementById("valuta");
            let quantita = document.getElementById("quantita").value;
            let risultato = document.getElementById("risultato");

            if (valuta.value == "" || quantita == "" ||
                isNaN(Number(quantita)) || Number(quantita) < 0) {

                risultato.innerHTML = "Inserisci una valuta e una quantità valida.";

            } else {

                let euro = Number(quantita) / Number(valuta.value);

                risultato.innerHTML = quantita + " " +
                    valuta.options[valuta.selectedIndex].text +
                    " = " + euro.toFixed(2) + " Euro";

            }
        }

    </script>

</body>
</html>
