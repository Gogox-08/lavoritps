<!DOCTYPE html>
<html>
<head>
  <style>

    body {
      font-family: Georgia, sans-serif;
      background-color: #4d0da1;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 50px;
      color: black;
    }

    h2 {
      color: black;
      margin-bottom: 30px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      width: 80%;
    }

    .card {
      background-color: #bb8df7;
      padding: 15px;
      border-radius: 20px;
      width: 220px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background-color: white;
      border-radius: 10px;
    }

    .btn {
      background-color: #5d2b9e;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 10px;
      margin-top: 10px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #804bc4;
    }

    .carrelloContainer {
      margin-top: 40px;
    }

    .carrelloBtn {
      background-color: #5d2b9e;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .carrelloBtn:hover {
      background-color: #804bc4;
    }

  </style>

  <script>

    function caricaProdotti() {

      var prodotti = JSON.parse(localStorage.getItem("prodotti"));

      if (!prodotti) {

        document.getElementById("container").innerHTML =
          "Nessun prodotto trovato";

        return;
      }

      var html = "";

      for (var i = 0; i < prodotti.length; i++) {

        html +=

          "<div class='card'>" +

          "<img src='" + prodotti[i].immagine.trim() + "'>" +

          "<h3>" +
          prodotti[i].marca + " " +
          prodotti[i].modello +
          "</h3>" +

          "<p>" +
          prodotti[i].prezzo +
          " €</p>" +

          "<button class='btn' onclick='vaiDettaglio(" + i + ")'>" +
          "Dettagli" +
          "</button>" +

          "</div>";
      }

      document.getElementById("container").innerHTML = html;
    }

    function vaiDettaglio(i) {

      window.location.href =
        "dettaglio.html?id=" + i;
    }

    function vaiCarrello() {

      window.location.href =
        "carrello.html";
    }

  </script>
</head>

<body onload="caricaProdotti()">

  <h2>Catalogo Prodotti</h2>

  <div class="container" id="container"></div>

  <div class="carrelloContainer">

    <button class="carrelloBtn"
            onclick="vaiCarrello()">

      Vai al carrello

    </button>

  </div>

</body>
</html>
