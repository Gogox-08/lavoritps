<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Georgia, sans-serif;
      background-color: #4d0da1;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 100px;
    }

    .box {
      background-color: #bb8df7;
      padding: 30px;
      border-radius: 25px;
      width: 500px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
      color: black;
    }

    input[type="file"] {
      margin-top: 15px;
      color: black;
    }

    input[type="button"] {
      background-color: #5d2b9e;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      margin-top: 15px;
      cursor: pointer;
    }

    input[type="button"]:hover {
      background-color: #804bc4;
    }
  </style>

  <script>
    function caricaCSV() {

      var file = document.getElementById("fileCSV").files[0];

      if (!file) {
        alert("Seleziona un file CSV!");
        return;
      }

      var reader = new FileReader();

      reader.onload = function(e) {

        var contenuto = e.target.result;

        var righe = contenuto.split("\n");

        var prodotti = [];

        for (var i = 1; i < righe.length; i++) {

          var colonne = righe[i].split(",");

          if (colonne.length < 5) continue;

          var prodotto = {
            marca: colonne[0].trim(),
            modello: colonne[1].trim(),
            descrizione: colonne[2].trim(),
            immagine: colonne[3].trim(),
            prezzo: colonne[4].trim()
          };

          prodotti.push(prodotto);
        }

        localStorage.setItem("prodotti", JSON.stringify(prodotti));

        alert("CSV caricato correttamente!");

        window.location.href = "index.html";
      };

      reader.readAsText(file);
    }
  </script>
</head>

<body>

  <div class="box">
    <h2>Configurazione CSV</h2>

    <p>
      Carica un file CSV con:<br><br>
      Marca, Modello, Descrizione, Immagine e Prezzo
    </p>

    <input type="file" id="fileCSV"><br>

    <input type="button" value="Carica" onclick="caricaCSV()">
  </div>

</body>
</html>
